<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Master Dactylographie - Expédition Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;700;800;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            color: #1e293b; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 30px 20px; position: relative;
        }
        
        .container { max-width: 1100px; width: 100%; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .header h1 { color: #0f172a; font-size: 1.5rem; margin: 0; font-weight: 900; display: flex; align-items: center; gap: 10px;}
        .btn-retour { background: #e2e8f0; color: #475569; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 700; transition: 0.2s; }
        .btn-retour:hover { background: #cbd5e1; color: #1e293b; }

        /* VUE PARCOURS */
        #vue-parcours { display: flex; flex-direction: column; align-items: center; width: 100%;}
        
        .header-stats { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; width: 100%; border-bottom: 2px solid #cbd5e1; padding-bottom: 20px;}
        .stat-badge { background: white; padding: 8px 15px; border-radius: 8px; font-weight: 800; color: #64748b; font-size: 0.9rem;}
        .stat-badge span { color: #0284c7; font-size: 1.1rem;}
        
        .section-parcours { width: 100%; margin-bottom: 40px; }
        .section-titre { font-size: 1.5rem; font-weight: 900; color: #334155; margin-bottom: 20px; text-align: left; padding-left: 10px;}
        
        .grid-lecons { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; width: 100%; }
        
        /* DESIGN DES CARTES FAÇON EDCLUB */
        .carte-lecon { 
            background: white; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s;
            position: relative; overflow: hidden; display: flex; flex-direction: column;
            border-bottom: 4px solid #e2e8f0;
        }
        .carte-lecon:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .carte-lecon.verrouille { background: #f8fafc; cursor: not-allowed; opacity: 0.6; }
        .carte-lecon.verrouille:hover { transform: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .lecon-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;}
        .lecon-num { font-size: 1.8rem; font-weight: 900; color: #475569; }
        .lecon-icon { font-size: 1.5rem; background: #f1f5f9; padding: 5px; border-radius: 50%;}
        
        .stars { color: #e2e8f0; font-size: 1.5rem; margin-bottom: 10px;}
        .stars span { margin: 0 -2px; }
        .star-gold { color: #fbbf24; text-shadow: 0 1px 2px rgba(251, 191, 36, 0.4);}
        
        .lecon-footer { background: #f8fafc; margin: 0 -15px -15px -15px; padding: 10px; font-size: 0.8rem; font-weight: 700; color: #64748b; border-top: 1px solid #e2e8f0; min-height: 38px; display: flex; align-items: center; justify-content: center;}

        /* BORDURES PAR CATÉGORIE */
        .cat-base { border-bottom-color: #3b82f6; }
        .cat-sequence { border-bottom-color: #eab308; }
        .cat-piege { border-bottom-color: #f97316; }
        .cat-symbole { border-bottom-color: #a855f7; }
        .cat-culture { border-bottom-color: #22c55e; }
        .cat-revision { border-bottom-color: #ef4444; background: #fff5f5; }

        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 1rem; color: #94a3b8;}

        /* VUE EXERCICE */
        #vue-exercice { display: none; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 900px; margin: 0 auto;}
        
        .top-bar-exo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px;}
        .top-bar-exo h2 { color: #0f172a; margin: 0; font-size: 1.4rem; }
        .live-stats { display: flex; gap: 20px; font-family: 'Fira Code', monospace; font-weight: bold; font-size: 1.2rem; color: #0ea5e9; }
        
        .typing-area { 
            font-family: 'Fira Code', monospace; font-size: 1.8rem; line-height: 1.8; color: #94a3b8; 
            position: relative; outline: none; letter-spacing: 1px; min-height: 200px;
            background: #f8fafc; padding: 25px; border-radius: 12px; border: 2px solid #e2e8f0; cursor: text;
        }

        .lettre { position: relative; }
        .lettre.correcte { color: #10b981; } 
        .lettre.fausse { color: #ef4444; background: rgba(239, 68, 68, 0.15); border-radius: 3px; }
        /* CORRECTION : On enlève le texte noir sur la lettre active pour ne plus déconcentrer */
        .lettre.active::before { content: ''; position: absolute; left: 0; bottom: -2px; width: 100%; height: 3px; background-color: #38bdf8; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        #hidden-input { position: absolute; opacity: 0; width: 1px; height: 1px; top: -100px; left: 0; border: none; padding: 0; }
        
        .controles-exo { margin-top: 30px; display: flex; gap: 15px; justify-content: center; }
        .btn-action { background: #0ea5e9; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #0284c7;}
        .btn-action:hover { background: #0284c7; transform: translateY(2px); box-shadow: 0 2px 0 #0369a1;}
        .btn-action.secondary { background: #94a3b8; box-shadow: 0 4px 0 #64748b; }
        .btn-action.secondary:hover { background: #64748b; transform: translateY(2px); box-shadow: 0 2px 0 #475569;}

        /* MODAL DE FIN */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 500px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); position: relative; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .modal-stars { font-size: 4rem; color: #e2e8f0; margin: 15px 0; letter-spacing: 5px;}
        .modal-stats { display: flex; justify-content: center; gap: 20px; margin: 25px 0; font-family: 'Fira Code', monospace; font-size: 1.5rem; font-weight: bold; color: #0f172a;}
        .stat-box { background: #f1f5f9; padding: 15px; border-radius: 12px; width: 130px; border: 1px solid #e2e8f0;}
        .stat-label { font-family: 'Inter', sans-serif; font-size: 0.8rem; color: #64748b; text-transform: uppercase; margin-top: 5px; font-weight: 700;}

    </style>
</head>
<body>

    <input type="text" id="hidden-input" autocomplete="off" spellcheck="false">

    <div class="container">
        <div class="header">
            <h1>⌨️ Typing Club - Académie</h1>
            <a href="index.html" class="btn-retour">← Quitter</a>
        </div>

        <div id="vue-parcours">
            <div class="header-stats">
                <div class="stat-badge">Progrès : <span id="stat-progres">0</span>%</div>
                <div class="stat-badge">Étoiles : <span id="total-stars">0</span></div>
                <div class="stat-badge">Record Vitesse : <span id="record-wpm">0</span> MPM</div>
            </div>
            
            <div id="zones-parcours" style="width: 100%;">
                </div>
        </div>

        <div id="vue-exercice">
            <div class="top-bar-exo">
                <h2 id="titre-exo-en-cours">Leçon 1</h2>
                <div class="live-stats">
                    <div id="live-wpm">0 MPM</div>
                    <div id="live-acc">100%</div>
                </div>
            </div>

            <div class="typing-area" id="zone-texte"></div>

            <div class="controles-exo">
                <button class="btn-action secondary" onclick="retourParcours()">Abandonner</button>
                <button class="btn-action" onclick="lancerExerciceActuel()">🔄 Recommencer</button>
            </div>
        </div>
    </div>

    <div id="modal-fin" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="font-size: 2rem; color: #0ea5e9; margin-bottom: 5px;">Félicitations !</h2>
            <div class="modal-stars" id="modal-stars">★★★</div>
            
            <div class="modal-stats">
                <div class="stat-box">
                    <div id="modal-wpm">0</div>
                    <div class="stat-label">Vitesse (MPM)</div>
                </div>
                <div class="stat-box">
                    <div id="modal-acc">0%</div>
                    <div class="stat-label">Précision</div>
                </div>
            </div>
            
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px; font-weight: 600;">Appuyez sur <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px;">Entrée</kbd> pour continuer</p>

            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn-action secondary" onclick="retourParcours()">Menu</button>
                <button class="btn-action secondary" onclick="lancerExerciceActuel()">🔄 Refaire</button>
                <button class="btn-action" id="btn-next-lesson" onclick="lancerProchaineLecon()">Suivant ➔</button>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        const DB_URL = `${FIREBASE_URL}scores/parent/dactyloPro.json`;

        // ==========================================
        // 1. GÉNÉRATION DES DONNÉES PÉDAGOGIQUES
        // ==========================================
        
        const sequencesCourantes = [
            { t: "ent", mots: ["vraiment", "souvent", "lentement", "doucement", "seulement", "tellement"] },
            { t: "ion", mots: ["attention", "nation", "action", "passion", "mission", "question"] },
            { t: "que", mots: ["chaque", "magnifique", "logique", "magique", "pratique", "technique"] },
            { t: "ment", mots: ["gouvernement", "développement", "environnement", "mouvement", "événement"] },
            { t: "eur", mots: ["ordinateur", "professeur", "voyageur", "chercheur", "navigateur", "couleur"] }
        ];

        const motsPieges = [
            "parallèle appeler courir mourir nourrir",
            "connexion abréviation réflexion exception",
            "développement enveloppe enveloppement",
            "accueil recueil cercueil orgueil",
            "fatigant exigeant navigant intrigant"
        ];

        const faitsCulturels = [
            "L'Everest est le plus haut sommet du monde avec ses 8848 mètres.",
            "Le cœur humain bat en moyenne environ 100 000 fois par jour.",
            "Neil Armstrong a été le premier homme à marcher sur la Lune en 1969.",
            "L'océan Pacifique couvre un tiers de la surface totale de la Terre.",
            "La Grande Muraille de Chine mesure plus de 21 000 kilomètres.",
            "L'eau bout à 100 degrés Celsius au niveau de la mer.",
            "Jupiter est la plus grande planète de notre système solaire.",
            "Le guépard est l'animal terrestre le plus rapide au monde.",
            "L'Amazonie produit environ 20% de l'oxygène de notre planète.",
            "La tour Eiffel a été construite pour l'Exposition universelle de 1889.",
            "Albert Einstein a développé la théorie de la relativité.",
            "L'ADN humain partage 50% de ses gènes avec ceux d'une banane !",
            "Le Mont Blanc est le point culminant de la chaîne des Alpes.",
            "La Révolution française a commencé avec la prise de la Bastille.",
            "Le guépard peut passer de 0 à 100 km/h en seulement trois secondes."
        ];

        let PARCOURS = [];
        let numId = 1;

        function addSection(titreSection, items, classeType, icone) {
            items.forEach(item => {
                PARCOURS.push({
                    id: numId++,
                    section: titreSection,
                    titre: item.titre,
                    texte: item.texte,
                    classe: classeType,
                    icon: icone
                });
            });
        }

        // Section 1 : Fondations (1 à 20)
        let bases = [
            { titre: "Touches F et J", texte: "ff jj fj jf ff jj fj jf" },
            { titre: "Touches D et K", texte: "dd kk dk kd df jk fd kj" },
            { titre: "Touches S et L", texte: "ss ll sl ls sf jl ds kl" },
            { titre: "Touches A et ;", texte: "aa ;; a; ;a as ;l af ;j" },
            { titre: "Mots de base 1", texte: "as la sa fa da kal las fas" },
            { titre: "Mots de base 2", texte: "fala jala salsa dallas fada" },
            { titre: "Touches E et I", texte: "ee ii ei ie de ki se li" },
            { titre: "Mots E et I", texte: "le la les des file pile sile" },
            { titre: "Touches R et U", texte: "rr uu ru ur fr ju dr ku" },
            { titre: "Mots R et U", texte: "rue dur sur fur rue dur sur" },
            { titre: "Touches T et Y", texte: "tt yy ty yt ft jy dt ky" },
            { titre: "Mots T et Y", texte: "ty type style tye type style" },
            { titre: "Touches C et ,", texte: "cc ,, c, ,c dc k, sc l," },
            { titre: "Touches V et M", texte: "vv mm vm mv fv jm dv km" },
            { titre: "Petits mots 1", texte: "le un la de du et en il" },
            { titre: "Petits mots 2", texte: "pour dans sur avec sans par" },
            { titre: "Les Majuscules", texte: "La Le Les Des Sur Dans" },
            { titre: "Ponctuation", texte: "Il est là. Elle va bien." },
            { titre: "Phrases simples", texte: "Le chat dort sur le lit." },
            { titre: "Défi de validation", texte: "La dactylographie permet de taper vite. C'est un outil indispensable !" }
        ];
        addSection("Fondations", bases, "cat-base", "⌨️");

        // Section 2 : Séquences Courantes (21 à 45)
        let seqItems = [];
        for(let i=0; i<5; i++) {
            sequencesCourantes.forEach(seq => {
                let phrase = [...seq.mots].sort(() => Math.random()-0.5).join(" ") + " " + seq.mots[0];
                seqItems.push({ titre: `Séquence : ${seq.t}`, texte: phrase });
            });
        }
        addSection("Séquences Courantes", seqItems, "cat-sequence", "🥁");

        // Section 3 : Mots Pièges (46 à 65)
        let piegeItems = [];
        for(let i=0; i<20; i++) {
            let p = motsPieges[i % motsPieges.length];
            piegeItems.push({ titre: `Mots complexes ${i+1}`, texte: p + " " + p.split(" ")[0] });
        }
        addSection("Mots Pièges", piegeItems, "cat-piege", "🧩");

        // Section 4 : Chiffres & Symboles (66 à 85)
        let symboleItems = [];
        for(let i=0; i<20; i++) {
            let annee = 1900 + Math.floor(Math.random()*124);
            let prix = Math.floor(Math.random()*99) + "," + Math.floor(Math.random()*99) + "€";
            let tel = "0" + Math.floor(Math.random()*9) + "-" + Math.floor(Math.random()*99) + "-" + Math.floor(Math.random()*99);
            symboleItems.push({ titre: `Chiffres ${i+1}`, texte: `L'année ${annee}, cela coûtait ${prix}. Tel: ${tel}.` });
        }
        addSection("Chiffres et Symboles", symboleItems, "cat-symbole", "🔢");

        // Section 5 : Expéditions Culturelles (86 à 150+)
        let cultureItems = [];
        for(let i=0; i<65; i++) {
            let texteCourt = faitsCulturels[i % faitsCulturels.length];
            let texteLong = texteCourt + " " + faitsCulturels[Math.floor(Math.random()*faitsCulturels.length)];
            cultureItems.push({ titre: `Fait n°${i+1}`, texte: texteLong });
        }
        addSection("Expéditions Culture", cultureItems, "cat-culture", "🌍");


        // --- VARIABLES GLOBALES ---
        let progressionData = { recordWPM: 0, etoilesGlobales: 0, niveauxStats: {}, statsTouches: {} };
        let leconActuelleId = null;
        let texteActuel = "";
        let indexFrappe = 0;
        let fautes = 0;
        let totalTapes = 0;
        let lastLength = 0;
        let tempsDebut = null;
        let timer = null;
        let partieFinie = false;
        let isComposing = false;
        const hiddenInput = document.getElementById('hidden-input');

        // --- SAUVEGARDE & CLOUD ---
        async function chargerProgression() {
            try {
                let res = await fetch(DB_URL);
                let data = await res.json();
                if (data) {
                    progressionData.recordWPM = data.wpm || 0;
                    progressionData.etoilesGlobales = data.etoilesGlobales || 0;
                    progressionData.niveauxStats = data.niveauxStats || {};
                    progressionData.statsTouches = data.statsTouches || {};
                }
            } catch(e) {}
            majAffichageParcours();
        }

        async function sauvegarderProgression(nouveauWPM, nbEtoiles, idLecon) {
            if (nouveauWPM > progressionData.recordWPM) progressionData.recordWPM = nouveauWPM;

            let etoilesActuellesNiveau = progressionData.niveauxStats[idLecon] || 0;
            if (nbEtoiles > etoilesActuellesNiveau) {
                progressionData.etoilesGlobales += (nbEtoiles - etoilesActuellesNiveau);
                progressionData.niveauxStats[idLecon] = nbEtoiles;
            }

            majAffichageParcours();

            try {
                await fetch(DB_URL, { 
                    method: 'PUT', 
                    body: JSON.stringify({ 
                        wpm: progressionData.recordWPM, 
                        etoilesGlobales: progressionData.etoilesGlobales,
                        niveauxStats: progressionData.niveauxStats,
                        statsTouches: progressionData.statsTouches
                    }) 
                });
            } catch(e) {}
        }

        // --- INTERFACE PARCOURS ---
        function majAffichageParcours() {
            document.getElementById('total-stars').textContent = progressionData.etoilesGlobales;
            document.getElementById('record-wpm').textContent = progressionData.recordWPM;
            document.getElementById('stat-progres').textContent = Math.floor((Object.keys(progressionData.niveauxStats).length / PARCOURS.length) * 100);

            const container = document.getElementById('zones-parcours');
            container.innerHTML = '';
            
            let niveauPrecedentReussi = true;
            let currentSection = "";
            let currentGrid = null;

            PARCOURS.forEach((lecon) => {
                if (lecon.section !== currentSection) {
                    if (currentGrid !== null) {
                        let divRev = creerCarteRevision(lecon.id - 0.5, niveauPrecedentReussi);
                        currentGrid.appendChild(divRev);
                    }

                    currentSection = lecon.section;
                    let sectDiv = document.createElement('div');
                    sectDiv.className = 'section-parcours';
                    sectDiv.innerHTML = `<h2 class="section-titre">${currentSection}</h2>`;
                    
                    currentGrid = document.createElement('div');
                    currentGrid.className = 'grid-lecons';
                    sectDiv.appendChild(currentGrid);
                    container.appendChild(sectDiv);
                }

                let nbEtoiles = progressionData.niveauxStats[lecon.id] || 0;
                let estDebloque = niveauPrecedentReussi;
                if (nbEtoiles < 1) niveauPrecedentReussi = false;

                let card = document.createElement('div');
                card.className = `carte-lecon ${lecon.classe} ${estDebloque ? '' : 'verrouille'}`;
                
                let starsHtml = "";
                for(let i=1; i<=3; i++) { starsHtml += `<span class="${i <= nbEtoiles ? 'star-gold' : ''}">★</span>`; }

                card.innerHTML = `
                    ${estDebloque ? '' : '<div class="lock-icon">🔒</div>'}
                    <div class="lecon-header">
                        <div class="lecon-num">${lecon.id}</div>
                        <div class="lecon-icon">${lecon.icon}</div>
                    </div>
                    <div class="stars">${starsHtml}</div>
                    <div class="lecon-footer">${lecon.titre}</div>
                `;

                if (estDebloque) card.onclick = () => preparerLecon(lecon.id);
                currentGrid.appendChild(card);
            });
        }

        function creerCarteRevision(idFictif, estDebloque) {
            let card = document.createElement('div');
            card.className = `carte-lecon cat-revision ${estDebloque ? '' : 'verrouille'}`;
            card.innerHTML = `
                ${estDebloque ? '' : '<div class="lock-icon">🔒</div>'}
                <div class="lecon-header">
                    <div class="lecon-num">🎯</div>
                    <div class="lecon-icon">🧠</div>
                </div>
                <div class="stars" style="font-size:0.9rem; color:#ef4444; font-weight:bold;">Coach IA</div>
                <div class="lecon-footer" style="color:#ef4444;">Révision ciblée</div>
            `;
            if (estDebloque) card.onclick = () => lancerEntrainementCible();
            return card;
        }

        function retourParcours() {
            document.getElementById('vue-exercice').style.display = 'none';
            document.getElementById('modal-fin').style.display = 'none';
            document.getElementById('vue-parcours').style.display = 'flex';
            clearInterval(timer);
        }

        // --- LE COACH ADAPTATIF ---
        function enregistrerFrappe(lettreAttendue, estCorrect) {
            let char = lettreAttendue.toLowerCase();
            if (char === ' ') char = 'Espace';
            if (!progressionData.statsTouches[char]) progressionData.statsTouches[char] = { tapes: 0, erreurs: 0 };
            
            progressionData.statsTouches[char].tapes++;
            if (!estCorrect) progressionData.statsTouches[char].erreurs++;
        }

        function obtenirPiresTouches() {
            let statsArray = [];
            for (const [char, stats] of Object.entries(progressionData.statsTouches)) {
                if (stats.tapes > 5) {
                    let txErreur = (stats.erreurs / stats.tapes) * 100;
                    if (txErreur > 0) statsArray.push({ char: char, txErreur: txErreur });
                }
            }
            statsArray.sort((a, b) => b.txErreur - a.txErreur);
            return statsArray.slice(0, 5); 
        }

        function lancerEntrainementCible() {
            const piresTouches = obtenirPiresTouches();
            
            let exerciceGenere = [];
            if (piresTouches.length === 0) {
                exerciceGenere.push(faitsCulturels[Math.floor(Math.random() * faitsCulturels.length)]);
            } else {
                let lettresCibles = piresTouches.map(t => t.char);
                for(let i=0; i<15; i++) {
                    let cluster = "";
                    for(let j=0; j<5; j++) cluster += lettresCibles[Math.floor(Math.random() * lettresCibles.length)];
                    exerciceGenere.push(cluster);
                }
            }

            leconActuelleId = "coach"; 
            texteActuel = exerciceGenere.join(" ");
            
            document.getElementById('vue-parcours').style.display = 'none';
            document.getElementById('vue-exercice').style.display = 'block';
            document.getElementById('titre-exo-en-cours').textContent = `🎯 Révision sur mesure`;
            
            lancerMoteurSaisie();
        }

        // --- MOTEUR DE FRAPPE ---
        function preparerLecon(id) {
            leconActuelleId = id;
            texteActuel = PARCOURS.find(l => l.id === leconActuelleId).texte;
            
            document.getElementById('vue-parcours').style.display = 'none';
            document.getElementById('modal-fin').style.display = 'none';
            document.getElementById('vue-exercice').style.display = 'block';
            
            let lObj = PARCOURS.find(l => l.id === id);
            document.getElementById('titre-exo-en-cours').textContent = `${lObj.id} - ${lObj.titre}`;
            
            lancerMoteurSaisie();
        }

        function lancerMoteurSaisie() {
            indexFrappe = 0; fautes = 0; totalTapes = 0; lastLength = 0; tempsDebut = null; partieFinie = false;
            clearInterval(timer);
            
            document.getElementById('live-wpm').textContent = "0 MPM";
            document.getElementById('live-acc').textContent = "100%";

            const zone = document.getElementById('zone-texte');
            zone.innerHTML = "";
            for(let i=0; i<texteActuel.length; i++) {
                let span = document.createElement('span');
                span.textContent = texteActuel[i];
                span.className = 'lettre';
                if(i === 0) span.classList.add('active');
                zone.appendChild(span);
            }
            
            hiddenInput.value = "";
            hiddenInput.focus();
        }

        function lancerExerciceActuel() {
            if(leconActuelleId === "coach") lancerEntrainementCible();
            else preparerLecon(leconActuelleId);
            document.getElementById('modal-fin').style.display = 'none';
        }

        function demarrerTimer() {
            if(!tempsDebut) {
                tempsDebut = new Date();
                timer = setInterval(majStatsLive, 500);
            }
        }

        function majStatsLive() {
            if (indexFrappe === 0 || partieFinie) return { wpm: 0, acc: 100 };
            let precision = Math.max(0, Math.floor(((totalTapes - fautes) / totalTapes) * 100)) || 100;
            let tempsMinutes = (new Date() - tempsDebut) / 60000;
            let motsParMinute = tempsMinutes > 0 ? Math.floor((indexFrappe / 5) / tempsMinutes) : 0;

            document.getElementById('live-acc').textContent = precision + "%";
            document.getElementById('live-wpm').textContent = motsParMinute + " MPM";
            return { wpm: motsParMinute, acc: precision };
        }

        document.addEventListener('click', (e) => {
            if (document.getElementById('vue-exercice').style.display === 'block' && document.getElementById('modal-fin').style.display !== 'flex') {
                hiddenInput.focus();
            }
        });

        hiddenInput.addEventListener('compositionstart', () => { isComposing = true; });
        hiddenInput.addEventListener('compositionend', () => { isComposing = false; handleInput(); });
        
        hiddenInput.addEventListener('input', () => {
            if (isComposing) return;
            handleInput();
        });

        function handleInput() {
            if(partieFinie || document.getElementById('vue-exercice').style.display === 'none') return;
            demarrerTimer();
            
            let typed = hiddenInput.value;
            if(typed.length > texteActuel.length) {
                typed = typed.substring(0, texteActuel.length);
                hiddenInput.value = typed;
            }

            if (typed.length > lastLength) {
                let newChars = typed.length - lastLength;
                totalTapes += newChars;
                for(let i = lastLength; i < typed.length; i++) {
                    let estJuste = typed[i] === texteActuel[i];
                    if (!estJuste) fautes++;
                    enregistrerFrappe(texteActuel[i], estJuste);
                }
            }
            lastLength = typed.length;
            indexFrappe = typed.length;

            let spans = document.querySelectorAll('.lettre');
            spans.forEach((span, i) => {
                span.className = 'lettre';
                if (i < typed.length) {
                    if (typed[i] === texteActuel[i]) span.classList.add('correcte');
                    else span.classList.add('fausse');
                } else if (i === typed.length) {
                    span.classList.add('active');
                }
            });

            majStatsLive();

            if(typed.length >= texteActuel.length) {
                terminerPartie();
            }
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('modal-fin').style.display === 'flex') {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    let btnNext = document.getElementById('btn-next-lesson');
                    if (btnNext.style.display !== 'none' && leconActuelleId !== "coach") lancerProchaineLecon(); 
                    else lancerExerciceActuel(); 
                }
            }
        });

        function terminerPartie() {
            let statsFinales = majStatsLive() || { wpm: 0, acc: 0 }; 
            partieFinie = true; clearInterval(timer);
            
            let precision = statsFinales.acc;
            let mpm = statsFinales.wpm;

            let etoiles = 0;
            if (precision >= 95) etoiles = 3;
            else if (precision >= 85) etoiles = 2;
            else if (precision >= 70) etoiles = 1;

            let starsHtml = "";
            for(let i=1; i<=3; i++) { starsHtml += `<span style="color: ${i <= etoiles ? '#fbbf24' : '#e2e8f0'}">★</span>`; }
            
            document.getElementById('modal-title').textContent = etoiles > 0 ? "Leçon Réussie !" : "Presque... Réessayez !";
            document.getElementById('modal-title').style.color = etoiles > 0 ? "#0ea5e9" : "#ef4444";
            document.getElementById('modal-stars').innerHTML = starsHtml;
            document.getElementById('modal-wpm').textContent = mpm;
            document.getElementById('modal-acc').textContent = precision + "%";
            
            let btnNext = document.getElementById('btn-next-lesson');
            if (leconActuelleId === "coach") {
                btnNext.style.display = "none";
            } else if (etoiles >= 1 && leconActuelleId < PARCOURS.length) {
                btnNext.style.display = "inline-block";
            } else {
                btnNext.style.display = "none";
            }

            document.getElementById('modal-fin').style.display = "flex";
            
            if (leconActuelleId !== "coach") {
                sauvegarderProgression(mpm, etoiles, leconActuelleId);
            }
            hiddenInput.blur();
        }

        function lancerProchaineLecon() {
            if (leconActuelleId !== "coach" && leconActuelleId < PARCOURS.length) {
                preparerLecon(leconActuelleId + 1);
            }
        }

        chargerProgression();
    </script>
</body>
</html>
