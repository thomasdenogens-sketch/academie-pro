<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dune V4 - Fix Moteur Physique</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            background-color: #05070a; color: #a3b3c2; 
            font-family: 'VT323', monospace; font-size: 1.4rem;
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 20px;
        }
        
        .dos-container { 
            width: 1050px; background: #1a1f26; 
            border: 6px double #3a4659; border-radius: 4px; padding: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; gap: 15px;
        }

        #game-container { 
            border: 4px solid #252d3a; background: #000;
            image-rendering: pixelated; cursor: crosshair;
        }

        .sidebar-panel { 
            flex: 1; background: #11141a; border: 4px solid #252d3a; 
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
        }

        .screen-text { background: #07090c; padding: 10px; border: 1px solid #252d3a; border-radius: 4px; }
        .money-display { font-size: 2.2rem; color: #f59e0b; text-align: center; font-weight: bold; }

        .dos-btn { 
            background: #252d3a; color: #e2e8f0; border: 2px solid #3a4659;
            padding: 12px; font-family: 'VT323', monospace; font-size: 1.4rem;
            cursor: pointer; text-align: left; transition: 0.1s; width: 100%;
        }
        .dos-btn:hover { background: #3a4659; color: #f59e0b; border-color: #f59e0b; }
        .dos-btn.active { background: #10b981; color: #0f172a; border-color: #059669; }

        .instructions { font-size: 1.1rem; color: #64748b; line-height: 1.3; }
        .instructions b { color: #38bdf8; }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 10px; color: #f59e0b;">Moteur Arrakis - V4.1 (Physics Fixed)</h2>
    
    <div class="dos-container">
        <div id="game-container"></div>

        <div class="sidebar-panel">
            <div class="screen-text">
                <div style="font-size:1.1rem; color:#64748b; text-align:center;">CRÉDITS DISPONIBLES</div>
                <div class="money-display" id="credits-ui">0150</div>
            </div>

            <div style="color:#f59e0b; border-bottom:1px solid #252d3a; padding-bottom:5px; margin-top:10px;">CONSTRUCTION</div>
            
            <button class="dos-btn" id="btn-concrete" onclick="setBuildMode('concrete')">🧱 Dalle Béton (10$)</button>
            <button class="dos-btn" id="btn-refinery" onclick="setBuildMode('refinery')">🏭 Raffinerie (80$)</button>
            <button class="dos-btn" onclick="setBuildMode(null)" style="text-align: center; color: #f87171;">❌ Annuler Ordre</button>

            <div class="instructions" style="margin-top: auto;">
                <b>Clic Gauche</b> : Sélectionner le tank (il clignotera en vert) / Poser un bâtiment.<br><br>
                <b>Clic Droit</b> : Déplacer le tank dans le noir pour effacer le brouillard.
            </div>
            
            <a href="index.html" class="dos-btn" style="text-align:center; text-decoration:none; margin-top:10px; background:#07090c;">Quitter</a>
        </div>
    </div>

    <script>
        let credits = 150;
        let buildMode = null;
        let updateCreditsUI;

        function setBuildMode(mode) {
            buildMode = mode;
            document.getElementById('btn-concrete').classList.remove('active');
            document.getElementById('btn-refinery').classList.remove('active');
            if (mode) document.getElementById(`btn-${mode}`).classList.add('active');
        }

        const TILE_SIZE = 32;
        const MAP_WIDTH = 22;  
        const MAP_HEIGHT = 18; 

        // --- LA CONFIGURATION CRUCIALE CORRIGÉE AVEC LE MOTEUR ARCADE PHYSICS ---
        const config = {
            type: Phaser.AUTO, 
            width: MAP_WIDTH * TILE_SIZE, 
            height: MAP_HEIGHT * TILE_SIZE,
            parent: 'game-container', 
            backgroundColor: '#000000',
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 }, debug: false }
            },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);

        let mapData = []; 
        let fogMap = [];  
        let tank;
        let selectedUnit = null;

        function preload() {
            this.cameras.main.setRoundPixels(true);
            
            // 1. SÉCURITÉ : On dessine des textures colorées par défaut en mémoire.
            // Si vos images GitHub ont un problème, ces couleurs s'afficheront au lieu de laisser un écran vide.
            let textures = ['ground_sand', 'ground_rock', 'unit_tank'];
            let colors = [0xdcb35c, 0x555555, 0x2563eb]; // Sable jaune, roche grise, tank bleu
            
            for(let i=0; i<textures.length; i++) {
                let gfx = this.make.graphics({x: 0, y: 0, add: false});
                gfx.fillStyle(colors[i]);
                gfx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                // Si c'est le tank, on lui dessine un petit canon blanc pour le reconnaître
                if(textures[i] === 'unit_tank') {
                    gfx.fillStyle(0xffffff); gfx.fillRect(16, 12, 16, 8);
                }
                gfx.generateTexture(textures[i], TILE_SIZE, TILE_SIZE);
            }

            // 2. CHARGEMENT DE VOS VRAIES IMAGES
            // Si le fichier existe, Phaser écrasera automatiquement le carré de couleur ci-dessus.
            this.load.image('ground_sand', 'assets/sable.png');
            this.load.image('ground_rock', 'assets/rocher.png');
            this.load.image('unit_tank', 'assets/tank.png');
        }

        function create() {
            this.input.mouse.disableContextMenu();

            // 1. DESSIN DU SOL
            for (let y = 0; y < MAP_HEIGHT; y++) {
                mapData[y] = [];
                for (let x = 0; x < MAP_WIDTH; x++) {
                    if (y > 10 && x < 8) mapData[y][x] = 1; // Zone de Roche en bas à gauche
                    else mapData[y][x] = 0; // Le reste est du Sable
                    
                    let texture = mapData[y][x] === 1 ? 'ground_rock' : 'ground_sand';
                    let tile = this.add.image(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2, texture);
                    tile.setDepth(0);
                }
            }

            // 2. POSE DU BROUILLARD DE GUERRE NOIR
            for (let y = 0; y < MAP_HEIGHT; y++) {
                fogMap[y] = [];
                for (let x = 0; x < MAP_WIDTH; x++) {
                    let fog = this.add.rectangle(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE, TILE_SIZE, 0x000000);
                    fog.setDepth(10); 
                    fogMap[y][x] = fog;
                }
            }

            // 3. CRÉATION DU TANK AVEC LA PHYSIQUE SÉCURISÉE
            tank = this.physics.add.sprite(3 * TILE_SIZE + TILE_SIZE/2, 14 * TILE_SIZE + TILE_SIZE/2, 'unit_tank');
            tank.setDepth(5);
            tank.setInteractive();
            tank.targetX = tank.x; tank.targetY = tank.y; tank.isMoving = false;

            updateCreditsUI = () => {
                document.getElementById('credits-ui').innerText = credits.toString().padStart(4, '0');
            };
            updateCreditsUI();

            // 4. INTERACTION SOURIS COMPLÈTE
            this.input.on('pointerdown', (pointer) => {
                let tx = Math.floor(pointer.x / TILE_SIZE);
                let ty = Math.floor(pointer.y / TILE_SIZE);

                if (pointer.leftButtonDown()) {
                    if (buildMode) {
                        // Empêcher de construire dans le noir
                        if (fogMap[ty] && fogMap[ty][tx]) { return; }

                        if (buildMode === 'concrete' && mapData[ty][tx] === 1 && credits >= 10) {
                            mapData[ty][tx] = 2; credits -= 10;
                            let concrete = this.add.rectangle(tx*TILE_SIZE+16, ty*TILE_SIZE+16, TILE_SIZE, TILE_SIZE, 0x374151);
                            concrete.setStrokeStyle(1, 0x1f2937); concrete.setDepth(1);
                            updateCreditsUI(); setBuildMode(null);
                        } 
                        else if (buildMode === 'refinery' && mapData[ty][tx] === 2 && credits >= 80) {
                            mapData[ty][tx] = 3; credits -= 80;
                            let refinery = this.add.rectangle(tx*TILE_SIZE+16, ty*TILE_SIZE+16, TILE_SIZE-6, TILE_SIZE-6, 0x1e40af);
                            refinery.setStrokeStyle(2, 0x60a5fa); refinery.setDepth(2);
                            updateCreditsUI(); setBuildMode(null);
                        }
                    } else {
                        // Clic gauche sur le Tank pour le sélectionner
                        let distanceAuTank = Phaser.Math.Distance.Between(pointer.x, pointer.y, tank.x, tank.y);
                        if (distanceAuTank < TILE_SIZE) {
                            selectedUnit = tank;
                            tank.setTint(0x4ade80); // Coloration verte de sélection
                        } else {
                            // Clic dans le vide : on désélectionne
                            selectedUnit = null;
                            tank.clearTint();
                        }
                    }
                } 
                else if (pointer.rightButtonDown() && selectedUnit) {
                    // Clic droit : Donner l'ordre de bouger
                    tank.targetX = Math.floor(pointer.x / TILE_SIZE) * TILE_SIZE + TILE_SIZE/2;
                    tank.targetY = Math.floor(pointer.y / TILE_SIZE) * TILE_SIZE + TILE_SIZE/2;
                    tank.isMoving = true;
                }
            });
        }

        function update() {
            if (tank.isMoving) {
                const speed = 120; // Vitesse physique
                let distance = Phaser.Math.Distance.Between(tank.x, tank.y, tank.targetX, tank.targetY);

                if (distance > 4) {
                    this.physics.moveTo(tank, tank.targetX, tank.targetY, speed);
                } else {
                    tank.body.setVelocity(0, 0); // Stop net
                    tank.x = tank.targetX; tank.y = tank.targetY;
                    tank.isMoving = false;
                }
            }

            // DISSIPATION DU BROUILLARD AUTOUR DU TANK
            let tankTx = Math.floor(tank.x / TILE_SIZE);
            let tankTy = Math.floor(tank.y / TILE_SIZE);
            let vision = 3; 

            for (let y = tankTy - vision; y <= tankTy + vision; y++) {
                for (let x = tankTx - vision; x <= tankTx + vision; x++) {
                    if (x >= 0 && x < MAP_WIDTH && y >= 0 && y < MAP_HEIGHT) {
                        if (fogMap[y][x]) {
                            fogMap[y][x].destroy();
                            fogMap[y][x] = null;
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
