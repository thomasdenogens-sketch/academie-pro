<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilogie RTS Rétro - Espace Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 30px 20px; 
        }
        
        .container { max-width: 1050px; width: 100%; background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { color: #f59e0b; font-size: 1.8rem; font-weight: 800; }
        .btn-retour { background: #334155; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; transition: 0.2s; font-weight: 600;}
        .btn-retour:hover { background: #475569; }
        .xp-badge { font-family: 'Fira Code', monospace; font-weight: bold; font-size: 1.1rem; color: #f59e0b; background: #0f172a; padding: 6px 16px; border-radius: 20px; border: 1px solid #334155; }

        .workspace { display: grid; grid-template-columns: 1fr 320px; gap: 25px; margin-top: 15px; }

        /* --- LE CHAMP DE BATAILLE TACTIQUE --- */
        .battlefield-panel { display: flex; flex-direction: column; gap: 15px; }
        
        #map-grid {
            display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
            width: 100%; aspect-ratio: 1; border: 4px solid #334155; border-radius: 8px; overflow: hidden;
            background-color: #d97706; /* Par défaut Arrakis */
            transition: background-color 0.5s ease;
        }

        .cell {
            border: 1px solid rgba(15, 23, 42, 0.15); display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-size: 1.5rem; position: relative;
        }
        .cell-label { position: absolute; bottom: 2px; font-size: 0.55rem; color: rgba(255,255,255,0.6); font-family: monospace; }

        /* --- PANNEAU DE COMMANDEMENT --- */
        .control-panel { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .resource-box { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 8px; text-align: center; }
        .resource-title { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; font-weight: bold; }
        .resource-val { font-family: 'Fira Code', monospace; font-size: 1.6rem; font-weight: bold; color: #f59e0b; margin-top: 2px; }

        .btn-build { background: #1e293b; color: white; border: 1px solid #334155; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; transition: 0.1s; }
        .btn-build:hover:not(:disabled) { border-color: #f59e0b; background: #27272a; }
        .btn-build:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-attack { background: #ef4444; color: #0f172a; border: none; padding: 15px; font-size: 1rem; font-weight: 800; border-radius: 8px; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); transition: 0.2s;}
        .btn-attack:hover { background: #dc2626; transform: translateY(-2px); }

        /* Journal de guerre */
        #war-log { background: #0f172a; border: 1px solid #334155; border-radius: 8px; height: 80px; padding: 10px; font-family: monospace; font-size: 0.8rem; overflow-y: auto; color: #94a3b8; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <select id="universe-select" onchange="changerUnivers()" style="background:#0f172a; color:#f59e0b; border:1px solid #334155; padding:10px 15px; border-radius:8px; font-size:1.1rem; font-weight:800; cursor:pointer; outline:none;">
                <option value="dune">🏜️ Monde I : Dune - Épice & Tanks</option>
                <option value="warcraft">🌲 Monde II : Fantasy - Or & Épées</option>
                <option value="starcraft">🌌 Monde III : Space Opera - Cristaux</option>
            </select>
            <div class="xp-badge" id="hud-xp">XP: ...</div>
        </div>

        <div class="workspace">
            <div class="battlefield-panel">
                <div id="map-grid"></div>
                <div id="war-log"></div>
            </div>

            <div class="control-panel">
                <div class="resource-box">
                    <div class="resource-title" id="lbl-money">CRÉDITS SOLAIRES</div>
                    <div class="resource-val" id="val-money">100 ⚙️</div>
                </div>

                <div style="font-size:0.8rem; font-weight:bold; color:#64748b; text-transform:uppercase;">Structures & Troupes</div>
                <button class="btn-build" id="btn-harv" onclick="produireUnite('harv')">
                    <span id="txt-btn-harv">🚜 Récolteur</span><span>50 ⚙️</span>
                </button>
                <button class="btn-build" id="btn-light" onclick="produireUnite('light')">
                    <span id="txt-btn-light">💂 Soldat Léger</span><span>30 ⚙️</span>
                </button>
                <button class="btn-build" id="btn-heavy" onclick="produireUnite('heavy')">
                    <span id="txt-btn-heavy">🚀 Tank de Siège</span><span>70 ⚙️</span>
                </button>

                <div style="margin-top: auto; display:flex; flex-direction:column; gap:10px;">
                    <button class="btn-attack" onclick="ordonnerAssaut()">🚀 LANCER L'ASSAUT GÉNÉRAL</button>
                    <a href="index.html" class="btn-retour" style="text-align: center; background:#334155; padding:12px;">Quitter le Poste</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://academie-famille-default-rtdb.europe-west1.firebasedatabase.app/";
        let xpPro = 0;

        // --- FICHE DE CONFIGURATION DES 3 UNIVERS ---
        const CONFIG_UNIVERS = {
            dune: {
                bg: "#cc8833", resLabel: "CRÉDITS D'ÉPICE", iconRes: "🟧",
                baseP: "🏰", baseE: "🦅", harv: "🚜", light: "💂", heavy: "🛞",
                nameP: "Atreides", nameE: "Harkonnen"
            },
            warcraft: {
                bg: "#15803d", resLabel: "RÉSERVES D'OR", iconRes: "🟨",
                baseP: "🏯", baseE: "⛺", harv: "👨‍🌾", light: "⚔️", heavy: "💥",
                nameP: "Humains", nameE: "Orcs"
            },
            starcraft: {
                bg: "#090d16", resLabel: "MINÉRAUX RAFFINÉS", iconRes: "💎",
                baseP: "🚀", baseE: "👾", harv: "🤖", light: "🔫", heavy: "🛸",
                nameP: "Terrans", nameE: "Zergs"
            }
        };

        let universActuel = 'dune';
        let credits = 100, gameLoop = null;
        
        // Entités : { id, type, player (1=vous, 2=IA), pos: 0-99, hp }
        let entities = [], entityIdCounter = 0;

        async function chargerDonnees() {
            try {
                let res = await fetch(`${FIREBASE_URL}scores/parent/rtsPro.json`);
                let data = await res.json(); xpPro = data ? (parseInt(data.xp) || 0) : 0;
                document.getElementById('hud-xp').textContent = `XP: ${xpPro}`;
            } catch(e) {}
            lancerPartie();
        }

        async function sauverXP(points) {
            xpPro += points; document.getElementById('hud-xp').textContent = `XP: ${xpPro}`;
            await fetch(`${FIREBASE_URL}scores/parent/rtsPro.json`, { method: 'PUT', body: JSON.stringify({ xp: xpPro }) });
        }

        function changerUnivers() {
            universActuel = document.getElementById('universe-select').value;
            logGuerre("切换 " + universActuel.toUpperCase());
            lancerPartie();
        }

        function lancerPartie() {
            clearInterval(gameLoop);
            credits = 100; entities = []; entityIdCounter = 0;
            
            // Appliquer le style visuel de l'univers sélectionné
            let cfg = CONFIG_UNIVERS[universActuel];
            document.getElementById('map-grid').style.backgroundColor = cfg.bg;
            document.getElementById('lbl-money').textContent = cfg.resLabel;
            
            // Injecter les deux QG (Vos coordonnées en bas à gauche = case 90, Ennemi en haut à droite = case 9)
            entities.push({ id: entityIdCounter++, type: 'hq', player: 1, pos: 90, hp: 500 });
            entities.push({ id: entityIdCounter++, type: 'hq', player: 2, pos: 9, hp: 500 });
            
            logGuerre(`⚡ Déploiement de l'univers : ${universActuel.toUpperCase()}. Préparez vos troupes !`);
            
            creerTerrainHTML();
            actualiserInterface();
            
            // Démarrage du moteur en Temps Réel (1 tick par seconde)
            gameLoop = setInterval(moteurRTS, 1000);
        }

        function creerTerrainHTML() {
            const grid = document.getElementById('map-grid'); grid.innerHTML = '';
            for(let i=0; i<100; i++) {
                let cell = document.createElement('div'); cell.className = 'cell'; cell.id = `grid-${i}`;
                
                // Mettre un peu de ressources au milieu de la carte tactique
                if([44, 45, 54, 55, 34, 35, 64, 65].includes(i)) {
                    cell.setAttribute('data-resource', 'true');
                }
                
                let lbl = document.createElement('span'); lbl.className = 'cell-label';
                cell.appendChild(lbl); grid.appendChild(cell);
            }
            dessinerUnites();
        }

        function dessinerUnites() {
            // Nettoyer les cases
            let cfg = CONFIG_UNIVERS[universActuel];
            for(let i=0; i<100; i++) {
                let cell = document.getElementById(`grid-${i}`);
                let lbl = cell.querySelector('.cell-label');
                cell.textContent = ''; cell.appendChild(lbl);
                
                if(cell.getAttribute('data-resource') === 'true') {
                    cell.textContent = cfg.iconRes; cell.appendChild(lbl);
                }
            }
            
            // Placer les entités vivantes
            entities.forEach(ent => {
                let cell = document.getElementById(`grid-${ent.pos}`);
                if(!cell) return;
                
                let icone = "";
                if(ent.type === 'hq') icone = ent.player === 1 ? cfg.baseP : cfg.baseE;
                if(ent.type === 'harv') icone = cfg.harv;
                if(ent.type === 'light') icone = cfg.light;
                if(ent.type === 'heavy') icone = cfg.heavy;
                
                let textNode = document.createTextNode(icone);
                cell.insertBefore(textNode, cell.firstChild);
                
                // Barre de vie simplifiée
                let lbl = cell.querySelector('.cell-label');
                lbl.textContent = `${ent.player===1?'P1':'IA'}:${ent.hp}`;
                lbl.style.color = ent.player === 1 ? '#38bdf8' : '#f87171';
            });
        }

        function produireUnite(type) {
            let couts = { harv: 50, light: 30, heavy: 70 };
            if(credits >= couts[type]) {
                credits -= couts[type];
                // Spawn au QG du joueur (case 90)
                entities.push({ id: entityIdCounter++, type: type, player: 1, pos: 90, hp: type==='heavy'?120:(type==='harv'?80:50), mission: 'idle' });
                logGuerre(`🔨 Production terminée : ${type.toUpperCase()}`);
                actualiserInterface(); dessinerUnites();
            }
        }

        function ordonnerAssaut() {
            let troupes = entities.filter(e => e.player === 1 && (e.type === 'light' || e.type === 'heavy'));
            if(troupes.length === 0) { logGuerre("⚠️ Aucune troupe disponible pour l'assaut !"); return; }
            troupes.forEach(t => t.mission = 'attack');
            logGuerre("🚀 ASSAUT GÉNÉRAL ! Vos armées marchent sur le QG ennemi !");
        }

        function moteurRTS() {
            let cfg = CONFIG_UNIVERS[universActuel];
            
            // 1. REVENUE DES RÉCOLTEURS AUTOMATIQUES
            entities.forEach(ent => {
                if(ent.type === 'harv') {
                    // Les récolteurs génèrent de l'argent s'ils sont vivants
                    credits += ent.player === 1 ? 8 : 0;
                }
            });

            // 2. IA ENNEMIE (Produit et attaque automatiquement toutes les 4 secondes)
            if(Math.random() < 0.25) {
                let typesIA = ['light', 'heavy'];
                let choixType = typesIA[Math.floor(Math.random()*2)];
                entities.push({ id: entityIdCounter++, type: choixType, player: 2, pos: 9, hp: choixType==='heavy'?120:50, mission: 'attack' });
                logGuerre(`⚠️ Alerte : Les ${cfg.nameE} déploient un ${choixType.toUpperCase()} !`);
            }

            // 3. LOGIQUE DE DÉPLACEMENT VERS LA BASE ADVERSE
            entities.forEach(ent => {
                if(ent.type === 'hq' || ent.type === 'harv') return;
                
                if(ent.mission === 'attack') {
                    let cible = ent.player === 1 ? 9 : 90; // Aller vers le QG opposé
                    if(ent.pos !== cible) {
                        // Progression pas à pas sur la grille linéaire (0 à 99)
                        if(ent.pos < cible) ent.pos += Math.min(4, cible - ent.pos);
                        else ent.pos -= Math.min(4, ent.pos - cible);
                    }
                }
            });

            // 4. RÉSOLUTION DES COMBATS (Si deux unités ennemies sont proches)
            for(let i=0; i<entities.length; i++) {
                for(let j=i+1; j<entities.length; j++) {
                    let e1 = entities[i]; let e2 = entities[j];
                    if(e1.player !== e2.player && Math.abs(e1.pos - e2.pos) <= 5) {
                        // Combat !
                        let d1 = e1.type === 'heavy' ? 25 : 10;
                        let d2 = e2.type === 'heavy' ? 25 : 10;
                        e1.hp -= d2; e2.hp -= d1;
                    }
                }
            }

            // Élimination des pertes
            let qgJoueurVivant = false, qgIAVivant = false;
            entities = entities.filter(e => {
                if(e.hp <= 0) {
                    if(e.type !== 'hq') logGuerre(`💥 Unité détruite au secteur ${e.pos}`);
                    return false;
                }
                if(e.type === 'hq' && e.player === 1) qgJoueurVivant = true;
                if(e.type === 'hq' && e.player === 2) qgIAVivant = true;
                return true;
            });

            // 5. CONDITIONS DE FIN DE PARTIE
            if(!qgIAVivant) {
                clearInterval(gameLoop); logGuerre(`🏆 VICTOIRE ! La base des ${cfg.nameE} est anéantie !`);
                sauverXP(30); return;
            }
            if(!qgJoueurVivant) {
                clearInterval(gameLoop); logGuerre(`💀 DÉFAITE... Votre base a été rasée.`);
                return;
            }

            actualiserInterface();
            dessinerUnites();
        }

        function actualiserInterface() {
            document.getElementById('val-money').textContent = `${credits} ⚙️`;
            document.getElementById('btn-harv').disabled = credits < 50;
            document.getElementById('btn-light').disabled = credits < 30;
            document.getElementById('btn-heavy').disabled = credits < 70;
            
            // Renommer les boutons selon l'univers
            let cfg = CONFIG_UNIVERS[universActuel];
            document.getElementById('txt-btn-harv').textContent = `🚜 Recruter ${cfg.harv} (${cfg.harv==='🚜'?'Moissonneuse':'Ouvrier'})`;
            document.getElementById('txt-btn-light').textContent = `⚔️ Entraîner ${cfg.light} (${cfg.light==='💂'?'Soldat':'Guerrier'})`;
            document.getElementById('txt-btn-heavy').textContent = `🔥 Construire ${cfg.heavy}`;
        }

        function logGuerre(msg) {
            const log = document.getElementById('war-log');
            log.innerHTML += `<div>📡 ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        chargerDonnees();
    </script>
</body>
</html>
