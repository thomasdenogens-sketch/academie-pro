<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dune V3 - Phaser Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { 
            background-color: #000; margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            color: #e2e8f0; font-family: monospace;
        }
        #game-container { border: 4px solid #334155; box-shadow: 0 0 20px rgba(217, 119, 6, 0.5); }
        .btn-retour { 
            margin-top: 20px; background: #334155; color: white; padding: 10px 20px; 
            text-decoration: none; border-radius: 5px; font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Arrakis Engine - V3 (Phaser)</h2>
    <div id="game-container"></div>
    <a href="index.html" class="btn-retour">Retour au Dashboard</a>

    <script>
        // --- CONFIGURATION DU MOTEUR PHASER ---
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        // Variables globales du jeu
        let cursorKeys;
        let harvester;
        const TILE_SIZE = 32;

        // 1. PRELOAD : Chargement des ressources
        function preload() {
            // --- ASTUCE PROVISOIRE ---
            // On génère de fausses images en mémoire pour que le jeu fonctionne tout de suite.
            let gfx = this.make.graphics({x: 0, y: 0, add: false});
            
            // Texture Sable
            gfx.fillStyle(0xdcb35c); gfx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
            gfx.generateTexture('tex_sand', TILE_SIZE, TILE_SIZE);
            
            // Texture Epice
            gfx.clear(); gfx.fillStyle(0xcc5500); gfx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
            gfx.generateTexture('tex_spice', TILE_SIZE, TILE_SIZE);
            
            // Texture Moissonneuse (Bleu)
            gfx.clear(); gfx.fillStyle(0x2563eb); gfx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
            gfx.generateTexture('tex_harvester', TILE_SIZE, TILE_SIZE);

            /* --- COMMENT METTRE DE VRAIES IMAGES ---
               Quand vous aurez téléchargé de vraies images sur votre PC :
               1. Créez un dossier "assets" à côté de ce fichier HTML sur GitHub.
               2. Mettez vos images dedans (ex: sable.png).
               3. Effacez le bloc "Astuce Provisoire" ci-dessus.
               4. Décommentez les lignes ci-dessous :
               
               this.load.image('tex_sand', 'assets/sable.png');
               this.load.image('tex_spice', 'assets/epice.png');
               this.load.image('tex_harvester', 'assets/moissonneuse.png');
            */
        }

        // 2. CREATE : Création de la carte et des unités
        function create() {
            // Création d'une grille de fond
            for (let y = 0; y < 600; y += TILE_SIZE) {
                for (let x = 0; x < 800; x += TILE_SIZE) {
                    // 10% de chance d'avoir de l'épice, sinon du sable
                    let texture = Math.random() < 0.1 ? 'tex_spice' : 'tex_sand';
                    this.add.image(x + TILE_SIZE/2, y + TILE_SIZE/2, texture);
                }
            }

            // Ajout de notre unité (Moissonneuse)
            harvester = this.add.image(400, 300, 'tex_harvester');

            // Ajout des contrôles clavier (Flèches directionnelles)
            cursorKeys = this.input.keyboard.createCursorKeys();
        }

        // 3. UPDATE : Mouvements et logique en temps réel (60 fois par seconde)
        function update() {
            const speed = 3;

            if (cursorKeys.left.isDown) {
                harvester.x -= speed;
            } else if (cursorKeys.right.isDown) {
                harvester.x += speed;
            }

            if (cursorKeys.up.isDown) {
                harvester.y -= speed;
            } else if (cursorKeys.down.isDown) {
                harvester.y += speed;
            }
        }
    </script>
</body>
</html>
