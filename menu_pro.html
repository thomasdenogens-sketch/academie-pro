<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Repas - La Famille</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Nunito', sans-serif; background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); color: #2d3436; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        #app-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); max-width: 900px; width: 100%; text-align: center; }
        h1 { color: #d35400; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .sous-titre { color: #7f8c8d; font-size: 1.1rem; margin-bottom: 25px; font-weight: bold; }
        
        .btn-action { background: #27ae60; color: white; border: none; padding: 15px 30px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px #2196f3; transition: 0.2s; margin-bottom: 25px; }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }
        .btn-action:hover { background: #2ecc71; }
        
        .grille-semaine { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        
        .carte-jour { background: #f8f9fa; border: 3px solid #dfe6e9; border-radius: 15px; padding: 15px; text-align: left; transition: 0.2s; cursor: pointer; }
        .carte-jour:hover { border-color: #f39c12; transform: translateY(-3px); box-shadow: 0 8px 15px rgba(243, 156, 18, 0.2); }
        .jour-titre { font-size: 1.2rem; font-weight: 900; color: #f39c12; margin-bottom: 10px; border-bottom: 2px solid #ffeaa7; padding-bottom: 5px; text-transform: uppercase; }
        .plat-titre { font-size: 1.1rem; font-weight: bold; color: #2d3436; margin-bottom: 5px; }
        .plat-temps { font-size: 0.9rem; color: #e74c3c; font-weight: bold; }
        
        /* Fenêtre Modale pour la recette */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px;}
        .modal-content { background: white; padding: 30px; border-radius: 20px; max-width: 600px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; text-align: left;}
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: #bdc3c7; line-height: 1; }
        .close-btn:hover { color: #e74c3c; }
        
        .recette-titre { font-size: 2rem; color: #d35400; margin-bottom: 5px; font-weight: 900; }
        .recette-badge { display: inline-block; background: #ffeaa7; color: #d35400; padding: 5px 10px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; font-size: 0.9rem; }
        
        .section-titre { font-size: 1.3rem; color: #2980b9; margin: 15px 0 10px 0; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .liste-ing { list-style-type: none; }
        .liste-ing li { margin-bottom: 5px; padding-left: 25px; position: relative; font-size: 1.1rem;}
        .liste-ing li::before { content: '🛒'; position: absolute; left: 0; top: 0; font-size: 1rem; }
        
        .liste-etapes { margin-left: 20px; font-size: 1.1rem; line-height: 1.5; }
        .liste-etapes li { margin-bottom: 10px; padding-left: 10px; }
        .liste-etapes li::marker { font-weight: bold; color: #e74c3c; }

        .btn-retour { background: #34495e; color: white; padding: 10px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1.1rem; text-decoration: none; display: inline-block;}
    </style>
</head>
<body>

    <div id="app-container">
        <h1>👨‍🍳 Assistant Repas</h1>
        <p class="sous-titre">Des plats simples, rapides, et sans prise de tête !</p>
        
        <button class="btn-action" onclick="genererMenu()">🎲 Générer le menu de la semaine</button>
        
        <div class="grille-semaine" id="menu-grille">
            </div>

        <a href="index.html" class="btn-retour">🏠 Retour à l'Académie</a>
    </div>

    <div id="modal-recette" class="modal" onclick="fermerModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="fermerModal(true)">&times;</span>
            <div id="recette-details">
                </div>
        </div>
    </div>

    <script>
        // BASE DE DONNÉES DES RECETTES ULTRA-SIMPLES
        const baseRecettes = [
            {
                nom: "Croque-Monsieur Express", temps: "Prépa: 5 min | Cuisson: 10 min",
                ingredients: ["Pain de mie", "Jambon blanc", "Fromage râpé ou tranches", "Un peu de beurre ou crème fraîche"],
                etapes: [
                    "Tartiner légèrement l'extérieur des tranches de pain de mie.",
                    "Garnir l'intérieur avec le jambon et le fromage.",
                    "Parsemer un peu de fromage râpé sur le dessus.",
                    "Passer au four ou à la machine à croque-monsieur jusqu'à ce que le fromage fonde."
                ]
            },
            {
                nom: "Wraps Poulet-Crudités", temps: "Prépa: 10 min | Cuisson: 0 min",
                ingredients: ["Galettes de blé (Wraps)", "Émincés de poulet rôti (déjà cuit)", "Salade verte", "Tomates cerises", "Sauce au choix (mayo, yaourt...)"],
                etapes: [
                    "Étaler un peu de sauce au centre de chaque galette.",
                    "Déposer une poignée de salade et des tomates coupées en deux.",
                    "Ajouter les émincés de poulet.",
                    "Rouler le wrap en serrant bien et couper en deux."
                ]
            },
            {
                nom: "Pâtes Carbonara Simplifiées", temps: "Prépa: 5 min | Cuisson: 12 min",
                ingredients: ["Pâtes", "Lardons allumettes", "Crème fraîche épaisse", "Fromage râpé (ou parmesan)"],
                etapes: [
                    "Faire cuire les pâtes dans l'eau bouillante salée.",
                    "Pendant ce temps, faire dorer les lardons à la poêle (sans matière grasse).",
                    "Égoutter les pâtes, les remettre dans la casserole.",
                    "Mélanger avec les lardons, deux grosses cuillères de crème et le fromage."
                ]
            },
            {
                nom: "Omelette au Fromage", temps: "Prépa: 5 min | Cuisson: 5 min",
                ingredients: ["Œufs (2 par personne)", "Gruyère râpé", "Beurre", "Salade verte en sachet (pour accompagner)"],
                etapes: [
                    "Casser les œufs dans un bol, ajouter sel et poivre, et battre avec une fourchette.",
                    "Faire fondre un peu de beurre dans une poêle chaude.",
                    "Verser les œufs. Quand les bords cuisent, ramener vers le centre.",
                    "Ajouter le fromage, plier l'omelette en deux et servir avec la salade."
                ]
            },
            {
                nom: "Salade de Pâtes Estivale", temps: "Prépa: 15 min | Cuisson: 10 min",
                ingredients: ["Pâtes courtes (Pennes ou Fusillis)", "Tomates", "Dés de jambon ou thon", "Maïs en boîte", "Vinaigrette"],
                etapes: [
                    "Faire cuire les pâtes puis les passer sous l'eau froide pour les refroidir.",
                    "Couper les tomates en petits morceaux.",
                    "Dans un grand saladier, mélanger les pâtes, tomates, jambon (ou thon) et maïs.",
                    "Ajouter la vinaigrette, bien mélanger et c'est prêt !"
                ]
            },
            {
                nom: "Gnocchis à Poêler", temps: "Prépa: 2 min | Cuisson: 5 min",
                ingredients: ["Gnocchis à poêler (au rayon frais)", "Beurre ou huile d'olive", "Parmesan", "Jambon sec (optionnel)"],
                etapes: [
                    "Faire fondre le beurre dans une poêle.",
                    "Ajouter les gnocchis et les faire dorer 5 minutes en remuant souvent.",
                    "Servir immédiatement en saupoudrant de parmesan et en ajoutant le jambon en chiffonnade."
                ]
            },
            {
                nom: "Hot-Dogs Maison", temps: "Prépa: 5 min | Cuisson: 5 min",
                ingredients: ["Pains à hot-dog", "Saucisses de Strasbourg (Knacki)", "Ketchup ou Moutarde", "Oignons frits (en pot, optionnel)"],
                etapes: [
                    "Faire bouillir de l'eau et y plonger les saucisses pendant 3 minutes.",
                    "Ouvrir les pains et les passer 30 secondes au micro-ondes ou au grille-pain.",
                    "Mettre un peu de sauce dans le pain, insérer la saucisse.",
                    "Parsemer d'oignons frits."
                ]
            },
            {
                nom: "Riz Sauté Express", temps: "Prépa: 5 min | Cuisson: 8 min",
                ingredients: ["Sachets de riz micro-ondable", "Dés de jambon", "Petits pois (en boîte)", "Œufs (2)"],
                etapes: [
                    "Chauffer le riz au micro-ondes comme indiqué sur le sachet.",
                    "Dans une grande poêle, faire brouiller les œufs.",
                    "Ajouter les dés de jambon, les petits pois égouttés et le riz chaud.",
                    "Mélanger le tout avec un filet de sauce soja (si vous aimez)."
                ]
            },
            {
                nom: "Quiche Sans Pâte", temps: "Prépa: 10 min | Cuisson: 35 min (four)",
                ingredients: ["3 œufs", "50 cl de lait", "100g de farine", "100g de gruyère râpé", "200g de lardons"],
                etapes: [
                    "Préchauffer le four à 200°C.",
                    "Dans un saladier, fouetter les œufs avec la farine, puis ajouter le lait progressivement.",
                    "Ajouter les lardons et le gruyère.",
                    "Verser dans un plat beurré et enfourner 35 minutes."
                ]
            },
            {
                nom: "Tartines Tomate-Mozza", temps: "Prépa: 5 min | Cuisson: 10 min (four)",
                ingredients: ["Grandes tranches de pain de campagne", "Tomates", "Boule de mozzarella", "Huile d'olive"],
                etapes: [
                    "Disposer les tranches de pain sur une plaque de four.",
                    "Couper les tomates et la mozzarella en rondelles.",
                    "Alterner une tranche de tomate et une tranche de mozza sur le pain.",
                    "Ajouter un filet d'huile d'olive, du sel, et enfourner à 200°C pendant 10 min."
                ]
            }
        ];

        const jours = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];

        // Génère un nouveau menu aléatoire
        function genererMenu() {
            const grille = document.getElementById("menu-grille");
            grille.innerHTML = "";
            
            // On mélange la base de recettes
            let recettesMelangees = [...baseRecettes].sort(() => Math.random() - 0.5);
            
            // On prend les 7 premières pour faire la semaine
            let menuSemaine = recettesMelangees.slice(0, 7);

            jours.forEach((jour, index) => {
                let recette = menuSemaine[index];
                
                let carte = document.createElement("div");
                carte.className = "carte-jour";
                // On passe l'objet recette complet à la fonction d'affichage
                carte.onclick = () => afficherRecette(recette);
                
                carte.innerHTML = `
                    <div class="jour-titre">${jour}</div>
                    <div class="plat-titre">${recette.nom}</div>
                    <div class="plat-temps">⏱️ ${recette.temps.split(' | ')[0]}</div>
                `;
                
                grille.appendChild(carte);
            });
        }

        // Affiche la fenêtre modale avec les détails
        function afficherRecette(recette) {
            const details = document.getElementById("recette-details");
            
            let htmlIngredients = recette.ingredients.map(ing => `<li>${ing}</li>`).join('');
            let htmlEtapes = recette.etapes.map(etp => `<li>${etp}</li>`).join('');

            details.innerHTML = `
                <div class="recette-titre">${recette.nom}</div>
                <div class="recette-badge">⏱️ ${recette.temps}</div>
                
                <div class="section-titre">Ce qu'il vous faut :</div>
                <ul class="liste-ing">
                    ${htmlIngredients}
                </ul>

                <div class="section-titre">C'est parti !</div>
                <ol class="liste-etapes">
                    ${htmlEtapes}
                </ol>
            `;
            
            document.getElementById("modal-recette").style.display = "flex";
        }

        // Ferme la fenêtre modale
        function fermerModal(event) {
            if (event === true || event.target.id === "modal-recette") {
                document.getElementById("modal-recette").style.display = "none";
            }
        }

        // Lancement initial au chargement de la page
        genererMenu();
    </script>
</body>
</html>
